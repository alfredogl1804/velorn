<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
  <title>Monstruo Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; color: #f5f8f9;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body { display: grid; grid-template-rows: 1fr auto; }
    .stage { display: flex; align-items: center; justify-content: center; gap: 34px; }
    .mark { width: 184px; height: 184px; user-select: none; -webkit-user-drag: none; }
    .eyebrow { color: #00e5ff; font-size: 11px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
    .brand { margin-top: 8px; font-size: 38px; line-height: 1; font-weight: 700; letter-spacing: -.04em; }
    .role { margin-top: 11px; color: #77878e; font-size: 13px; letter-spacing: .02em; }
    .rule { width: 54px; height: 2px; margin-top: 20px; background: #00e5ff; }
    .status { padding: 12px 16px; border-top: 1px solid #182026; color: #77878e; text-align: center; font-size: 11px; letter-spacing: .06em; }
  </style>
</head>
<body>
  <main class="stage">
    <img class="mark" src="monstruo-studio-app-icon.svg" alt="" />
    <section aria-label="Monstruo Studio">
      <div class="eyebrow">El Monstruo</div>
      <div class="brand">Monstruo Studio</div>
      <div class="role">Edición y creación multimedia asistida por IA</div>
      <div class="rule" aria-hidden="true"></div>
    </section>
  </main>
  <div id="splash-status" class="status">Iniciando Monstruo Studio…</div>
</body>
</html>
